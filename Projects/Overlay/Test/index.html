<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />

    <title>Valorant Overlay by Clemxnade</title>
  </head>
  <body>
    <div class="main-wrapper positive">
      <div class="account">
        <div class="title">
          <p class="show-animate">RIOT ID</p>
          <p class="show-animate">TWITCH</p>
        </div>
        <div class="username">
          <p class="riot show-animate">ICE CREAM<span>#MOI</span></p>
          <p class="twitch show-animate">CLEMXNADE</p>
        </div>
      </div>
      <div class="record">
        <span class="rr-change">↑0 RR</span>
        <span class="win">0</span>-<span class="loss">0</span>
      </div>
    </div>
  </body>
</html>
