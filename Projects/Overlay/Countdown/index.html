<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script
      type="text/javascript"
      src="https://unpkg.com/@streamerbot/client/dist/streamerbot-client.js"
    ></script>

    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css" />

    <title>Countdown Overlay by Clemxnade</title>
  </head>
  <body>
    <div class="main-wrapper">
      <div class="timer">
        <div class="scroll-wrap">
          <div class="scroll-inner" id="m1"></div>
        </div>
        <div class="scroll-wrap">
          <div class="scroll-inner" id="m2"></div>
        </div>
        <div>:</div>
        <div class="scroll-wrap">
          <div class="scroll-inner" id="s1"></div>
        </div>
        <div class="scroll-wrap">
          <div class="scroll-inner" id="s2"></div>
        </div>
      </div>
    </div>
  </body>
</html>
